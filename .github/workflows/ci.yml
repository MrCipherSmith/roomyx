name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # `pinned` is .bun-version, the Bun the project is developed with; `floor`
    # is the lowest Bun in package.json `engines`. 1.2.0 and below fail the
    # launcher tests, so the floor is the lowest version actually run green.
    name: test (bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun: [pinned, floor]
    steps:
      - uses: actions/checkout@v4
      - if: matrix.bun == 'pinned'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - if: matrix.bun == 'floor'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.15"
      - run: bun install --frozen-lockfile
      - run: bun test
      # Opt-in locally, mandatory here: a test skipped by default and run
      # nowhere is a test that has been deleted slowly.
      - run: bun run test:e2e
      - run: bunx tsc --noEmit
      - run: bunx eslint src test
      - run: bun run check:changelog
      - run: bun audit
