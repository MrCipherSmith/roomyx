name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test
      # Opt-in locally, mandatory here: a test skipped by default and run
      # nowhere is a test that has been deleted slowly.
      - run: bun run test:e2e
      - run: bunx tsc --noEmit
      - run: bunx eslint src test
      - run: bun audit
